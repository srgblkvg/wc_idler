services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: azeroth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: azeroth
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U azeroth -d azeroth']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
